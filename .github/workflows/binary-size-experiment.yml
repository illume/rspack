name: Binary Size Experiment

# Manually-triggered workflow that builds the Rspack `.node` NAPI binding under
# several different binary-size optimization variants on Linux, macOS and
# Windows runners, then aggregates the resulting `.node` sizes into a single
# markdown summary table.
#
# Goals:
#  - Quantify the savings (or cost) of toggling each individual size knob
#    (`opt-level`, `lto`, `-Zbuild-std`, the `info-level` tracing feature, ...).
#  - Validate that conclusions hold across platforms (Linux/macOS/Windows use
#    different linkers and produce ELF/Mach-O/PE output respectively).
#  - Provide reproducible numbers that aren't biased by this sandboxed
#    environment (full fat-LTO release builds need ~16 GB RAM and many cores).
#
# Triggered manually from the Actions UI (`workflow_dispatch`) so it doesn't
# burn CI minutes on every push.

on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Also build the baseline + opt-level=s variants on macOS arm64'
        type: boolean
        default: true
      run_windows:
        description: 'Also build the baseline + opt-level=s variants on Windows x64'
        type: boolean
        default: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Linux: full matrix across every variant.
  # -------------------------------------------------------------------------
  linux:
    name: 'linux: ${{ matrix.variant }}'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          # Reference: shipped configuration. Anything we report is delta vs. this.
          - baseline
          # Force every release crate to opt-level="s" instead of "3".
          - opt-level-s-global
          # Even more aggressive size-only setting, opt-level="z".
          - opt-level-z-global
          # Drop fat LTO down to thin. Cheaper to build, usually a bit larger.
          - lto-thin
          # Disable LTO entirely. Fastest build; biggest output. Reference point.
          - lto-off
          # Reverse-test: drop `-Zbuild-std=panic_abort,std`. Shows how much that
          # rebuild-of-std currently saves us by stripping unused std code.
          - no-build-std
          # Reverse-test: drop the `info-level` feature flag. Currently this
          # asks `tracing` to drop debug/trace level codegen entirely - removing
          # it shows what those tracing levels would cost.
          - no-info-level
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free disk
        uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe # v1.0.0
        with:
          tool-cache: false

      - name: Apply variant patch
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/workflows/scripts/binary-size-apply-variant.sh

      - name: Pnpm Setup
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: linux-size-experiment-${{ matrix.variant }}
          save-if: false

      - name: Setup Rust Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Cargo codegen
        run: cargo codegen

      - name: Build binding (release)
        run: RUST_TARGET=x86_64-unknown-linux-gnu USE_NAPI_CROSS=1 pnpm build:binding:release
        env:
          TARGET_CC: clang

      - name: Measure
        run: bash .github/workflows/scripts/binary-size-measure.sh
        env:
          VARIANT: ${{ matrix.variant }}
          PLATFORM: linux-x64-gnu

      - name: Upload size report
        uses: ./.github/actions/artifact/upload
        with:
          name: size-report-linux-${{ matrix.variant }}
          path: size-report.json

  # -------------------------------------------------------------------------
  # macOS arm64: only baseline + the most likely actionable variant.
  # -------------------------------------------------------------------------
  macos:
    name: 'macos: ${{ matrix.variant }}'
    if: ${{ inputs.run_macos }}
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - opt-level-s-global
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply variant patch
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/workflows/scripts/binary-size-apply-variant.sh

      - name: Pnpm Setup
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: macos-size-experiment-${{ matrix.variant }}
          save-if: false

      - name: Setup Rust Target
        run: rustup target add aarch64-apple-darwin

      - name: Cargo codegen
        run: cargo codegen

      - name: Build binding (release)
        run: |
          export CC=$(xcrun -f clang)
          export CXX=$(xcrun -f clang++)
          SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
          export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
          RUST_TARGET=aarch64-apple-darwin pnpm build:binding:release

      - name: Measure
        run: bash .github/workflows/scripts/binary-size-measure.sh
        env:
          VARIANT: ${{ matrix.variant }}
          PLATFORM: darwin-arm64

      - name: Upload size report
        uses: ./.github/actions/artifact/upload
        with:
          name: size-report-macos-${{ matrix.variant }}
          path: size-report.json

  # -------------------------------------------------------------------------
  # Windows x64: only baseline + opt-level=s.
  # -------------------------------------------------------------------------
  windows:
    name: 'windows: ${{ matrix.variant }}'
    if: ${{ inputs.run_windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - opt-level-s-global
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply variant patch
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/workflows/scripts/binary-size-apply-variant.sh

      - name: Pnpm Setup
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: windows-size-experiment-${{ matrix.variant }}
          save-if: false

      - name: Setup Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cargo codegen
        run: cargo codegen

      - name: Build binding (release)
        run: RUST_TARGET=x86_64-pc-windows-msvc pnpm build:binding:release

      - name: Measure
        run: bash .github/workflows/scripts/binary-size-measure.sh
        env:
          VARIANT: ${{ matrix.variant }}
          PLATFORM: win32-x64-msvc

      - name: Upload size report
        uses: ./.github/actions/artifact/upload
        with:
          name: size-report-windows-${{ matrix.variant }}
          path: size-report.json

  # -------------------------------------------------------------------------
  # Aggregator: download every size-report-* artifact and render a single
  # markdown summary table to the workflow summary.
  # -------------------------------------------------------------------------
  summary:
    name: Aggregate results
    needs: [linux, macos, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all size reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: size-report-*

      - name: Render summary
        run: python3 .github/workflows/scripts/binary-size-summarize.py reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results for offline analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-size-experiment-results
          path: |
            combined-size-reports.json
            reports/**
          if-no-files-found: warn
